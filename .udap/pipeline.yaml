version: 1
name: nodejs-eks
vcs: github

# Delivery pipeline for the Node.js on EKS blueprint.
#
# Shape: seven quality and security gates run in parallel and all of them must
# pass before a single AWS resource is touched. Infrastructure comes up, the
# image is built and scanned, then the cluster is configured and verified.
#
# Rendered CI files are generated from this spec — never edit
# .github/workflows/* by hand.

stages:
  # ── Gates (parallel, no cloud access) ───────────────────────────────────────

  - id: lint
    kind: lint
    needs: []
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json — installing from package.json. Run 'npm install' locally and commit the lockfile so builds are reproducible."
            npm install --no-audit --no-fund
          fi
      - name: Coding standards
        run: npx eslint . --max-warnings=0
      - name: Formatting
        run: |
          if ! npx prettier --check "**/*.{js,mjs,json}"; then
            echo "::warning::Some files are not formatted. Run 'npm run format' and commit the result."
          fi

  - id: test
    kind: test
    needs: []
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json — installing from package.json. Run 'npm install' locally and commit the lockfile so builds are reproducible."
            npm install --no-audit --no-fund
          fi
      - name: Unit tests
        run: npm test

  - id: sast
    kind: security
    needs: []
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --quiet "semgrep>=1.90,<2"
      - name: Static application security testing
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/javascript \
            --severity ERROR \
            --sarif --output semgrep.sarif \
            --metrics off \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast
          path: semgrep.sarif
          retention-days: 30
      - name: Fail on SAST findings
        run: |
          COUNT="$(jq '[.runs[]?.results[]?] | length' semgrep.sarif)"
          echo "Semgrep ERROR-severity findings: ${COUNT}"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '.runs[].results[]
                   | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\n  rule: \(.ruleId)\n  \(.message.text | split("\n")[0])\n"' \
              semgrep.sarif
            echo "::error::Semgrep found ${COUNT} blocking finding(s). Fix them, or annotate a genuinely accepted one with '// nosemgrep: <rule-id>' plus the reason."
            exit 1
          fi

  - id: secrets_scan
    kind: security
    needs: []
    steps:
      - name: Install Gitleaks
        run: |
          mkdir -p bin
          curl --fail -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          chmod +x bin/gitleaks
          ./bin/gitleaks version
      - name: Secret scanning
        run: |
          ./bin/gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 0 \
            --report-format sarif \
            --report-path gitleaks.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
      - name: Fail on leaked secrets
        run: |
          COUNT="$(jq '[.runs[]?.results[]?] | length' gitleaks.sarif)"
          echo "Gitleaks findings: ${COUNT}"
          if [ "$COUNT" -gt 0 ]; then
            jq -r '.runs[].results[]
                   | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.ruleId)"' \
              gitleaks.sarif
            echo "::error::Gitleaks found ${COUNT} candidate secret(s). Rotate anything real, then reference it as \${{ secrets.NAME }}; add a false positive to the allowlist in .gitleaks.toml."
            exit 1
          fi

  - id: license_scan
    kind: security
    needs: []
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json — installing from package.json. Run 'npm install' locally and commit the lockfile so builds are reproducible."
            npm install --no-audit --no-fund
          fi
      - name: Licence compliance
        run: |
          npx --yes license-checker-rseidelsohn@4 \
            --production \
            --excludePrivatePackages \
            --onlyAllow "MIT;MIT-0;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;Unlicense;CC0-1.0;CC-BY-4.0;BlueOak-1.0.0;Python-2.0" \
            --csv --out licenses.csv
      - uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: licenses.csv
          retention-days: 90

  - id: sbom
    kind: security
    needs: []
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json — installing from package.json. Run 'npm install' locally and commit the lockfile so builds are reproducible."
            npm install --no-audit --no-fund
          fi
      - name: Generate CycloneDX SBOM for the dependency tree
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@1 \
            --omit dev \
            --output-format JSON \
            --output-file sbom-source.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-source
          path: sbom-source.cdx.json
          retention-days: 90

  - id: iac_scan
    kind: security
    needs: []
    steps:
      - name: Install Trivy
        run: |
          sudo apt-get install -y --no-install-recommends wget gnupg apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy
          trivy --version
      - name: Terraform security scan
        run: trivy config infra --severity CRITICAL --exit-code 1 --ignorefile .trivyignore
      - name: Terraform security report
        run: trivy config infra --severity HIGH,MEDIUM --exit-code 0 --ignorefile .trivyignore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkov baseline
        run: |
          pip install --quiet "checkov>=3,<4"
          checkov --directory infra --framework terraform --compact --soft-fail

  # ── Infrastructure ──────────────────────────────────────────────────────────

  - id: provision
    kind: provision
    needs: [lint, test, sast, secrets_scan, license_scan, sbom, iac_scan]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    steps:
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve

  - id: build_push
    kind: build_push
    needs: [provision]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Resolve image reference
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${{ secrets.PROJECT_NAME }}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .
      - name: Push image
        run: docker push "$IMAGE"

  - id: image_scan
    kind: security
    needs: [build_push]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Install Trivy
        run: |
          sudo apt-get install -y --no-install-recommends wget gnupg apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy
          trivy --version
      - name: Resolve image reference
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${{ secrets.PROJECT_NAME }}:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
      - name: Scan the image for vulnerabilities
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --scanners vuln,secret \
            --ignorefile .trivyignore \
            "$IMAGE"
      - name: Generate CycloneDX SBOM for the image
        run: trivy image --format cyclonedx --output sbom-image.cdx.json "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: sbom-image.cdx.json
          retention-days: 90

  # ── Release ─────────────────────────────────────────────────────────────────

  - id: configure
    kind: configure
    needs: [provision, image_scan]
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    steps:
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Read the database connection string
        # Read here rather than exported as a job output: GitHub silently drops
        # job outputs whose value contains a secret, and this one does.
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          DB_URL="$(terraform output -raw database_url 2>/dev/null || true)"
          if [ -n "$DB_URL" ]; then
            echo "::add-mask::${DB_URL}"
          else
            echo "No database in this configuration — the service will run stateless."
          fi
          echo "DB_URL=${DB_URL}" >> "$GITHUB_ENV"
      - name: Configure cluster access
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.PROJECT_NAME }}-eks" \
            --region "$AWS_REGION"
      - name: Install the metrics server
        # Supplies the CPU metrics the HorizontalPodAutoscaler scales on.
        run: |
          kubectl apply -f \
            https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
      - name: Bootstrap namespace and secrets
        run: |
          set -euo pipefail
          NAMESPACE="${{ secrets.PROJECT_NAME }}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${NAMESPACE}:${IMAGE_TAG}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "NAMESPACE=${NAMESPACE}" >> "$GITHUB_ENV"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "${DB_URL:-}" ]; then
            kubectl create secret generic app-database \
              --namespace "$NAMESPACE" \
              --from-literal=DATABASE_URL="${DB_URL}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            kubectl delete secret app-database --namespace "$NAMESPACE" --ignore-not-found
          fi

          # Apply the service account so the migration job can reference it.
          sed -e "s|%%NAMESPACE%%|${NAMESPACE}|g" \
              k8s/serviceaccount.yaml | kubectl apply -f -
      - name: Run database migrations inside the cluster
        # The RDS instance is in private subnets — only the EKS node security
        # group is permitted on port 5432. Migrations run as a one-shot
        # Kubernetes Job (k8s/db-migrate-job.yaml) using the app image, reading
        # DATABASE_URL from the app-database Secret applied above. Skipped when
        # no database is configured.
        run: |
          set -euo pipefail
          NAMESPACE="${{ secrets.PROJECT_NAME }}"

          if [ -z "${DB_URL:-}" ]; then
            echo "No database configured — skipping migrations."
            exit 0
          fi

          IMAGE_TAG="${GITHUB_SHA::12}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${NAMESPACE}:${IMAGE_TAG}"

          # Delete any leftover job from a previous run (idempotency).
          kubectl delete job db-migrate --namespace "$NAMESPACE" --ignore-not-found --wait=true

          # Apply the migration job manifest with placeholders substituted.
          sed -e "s|%%NAMESPACE%%|${NAMESPACE}|g" \
              -e "s|%%IMAGE%%|${IMAGE}|g" \
              k8s/db-migrate-job.yaml | kubectl apply -f -

          # Wait up to 5 minutes for completion.
          kubectl wait job/db-migrate \
            --namespace "$NAMESPACE" \
            --for=condition=complete \
            --timeout=300s

          echo "Migration job completed."
          kubectl logs job/db-migrate --namespace "$NAMESPACE" || true

          # Clean up the completed job so it does not accumulate across deploys.
          kubectl delete job db-migrate --namespace "$NAMESPACE" --ignore-not-found
      - name: Apply remaining Kubernetes manifests
        # The migration job and serviceaccount were applied above; apply
        # everything else (deployment, service, hpa, pdb). Glob excludes
        # db-migrate-job.yaml and serviceaccount.yaml to avoid redundant applies.
        run: |
          set -euo pipefail
          NAMESPACE="${{ secrets.PROJECT_NAME }}"
          IMAGE_TAG="${GITHUB_SHA::12}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${NAMESPACE}:${IMAGE_TAG}"

          for manifest in k8s/deployment.yaml k8s/service.yaml k8s/hpa.yaml k8s/poddisruptionbudget.yaml; do
            sed -e "s|%%NAMESPACE%%|${NAMESPACE}|g" \
                -e "s|%%IMAGE_TAG%%|${IMAGE_TAG}|g" \
                -e "s|%%IMAGE%%|${IMAGE}|g" \
                "$manifest" | kubectl apply -f -
          done
      - name: Wait for the rollout
        run: |
          kubectl rollout status deployment/api \
            --namespace "${{ secrets.PROJECT_NAME }}" \
            --timeout=10m

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - name: Wait for the load balancer
        run: |
          set -euo pipefail
          NAMESPACE="${{ secrets.PROJECT_NAME }}"
          aws eks update-kubeconfig --name "${NAMESPACE}-eks" --region "$AWS_REGION"
          HOST=""
          for _ in $(seq 1 40); do
            HOST="$(kubectl get svc api -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            if [ -n "$HOST" ]; then break; fi
            sleep 15
          done
          if [ -z "$HOST" ]; then
            echo "The load balancer never reported a hostname."
            kubectl describe svc api -n "$NAMESPACE" || true
            exit 1
          fi
          echo "APP_URL=http://${HOST}" >> "$GITHUB_ENV"
      - name: Health check
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${APP_URL}/health" || true)"
            if [ "$CODE" = "200" ]; then
              echo "Service is healthy at ${APP_URL}"
              curl -sS --max-time 10 "${APP_URL}/api/info" || true
              exit 0
            fi
            sleep 15
          done
          echo "The service never returned 200 from /health."
          kubectl get pods -n "${{ secrets.PROJECT_NAME }}" || true
          kubectl logs -n "${{ secrets.PROJECT_NAME }}" -l app.kubernetes.io/name=api --tail=100 || true
          exit 1

  - id: notify
    kind: notify
    needs: [verify]
    steps:
      - name: Deployment summary
        run: |
          {
            echo "### Deployment complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster | \`${{ secrets.PROJECT_NAME }}-eks\` |"
            echo "| Namespace | \`${{ secrets.PROJECT_NAME }}\` |"
            echo "| Image tag | \`${GITHUB_SHA::12}\` |"
            echo ""
            echo "Security artefacts for this run: Semgrep SAST, Gitleaks, licence report,"
            echo "dependency SBOM and image SBOM are attached to the workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

rollback:
  strategy: manual

# Teardown override. The default rendered destroy runs terraform alone, which
# cannot work here: the load balancer is created by Kubernetes, not terraform,
# and its presence blocks the VPC from being deleted. Remove the cluster's
# service objects first, then destroy the stack.
destroy:
  steps:
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Remove Kubernetes load balancers
      run: |
        NAMESPACE="${{ secrets.PROJECT_NAME }}"
        if aws eks update-kubeconfig --name "${NAMESPACE}-eks" --region "$AWS_REGION" 2>/dev/null; then
          kubectl delete svc --all -n "$NAMESPACE" --ignore-not-found --timeout=5m || true
          kubectl delete namespace "$NAMESPACE" --ignore-not-found --timeout=5m || true
          echo "Waiting for AWS to finish deleting the load balancer."
          sleep 120
        else
          echo "Cluster already gone — skipping Kubernetes cleanup."
        fi
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform destroy
      working-directory: infra
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=${AWS_REGION}"
        terraform destroy -input=false -auto-approve
