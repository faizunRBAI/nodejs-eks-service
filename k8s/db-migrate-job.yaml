apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: '%%NAMESPACE%%'
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
spec:
  # One attempt only — a failed migration must be investigated, not retried blindly.
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: '%%IMAGE%%'
          imagePullPolicy: IfNotPresent
          command:
            - node
            - src/migrate.js
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
